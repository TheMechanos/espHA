sentence=Home Assistant MQTT discovery library for ESP-IDF
paragraph=Lightweight library that provides an easy to use API for integrating an ESP32 device with Home Assistant over MQTT discovery. This fork has no dependency on the Arduino core: it talks to the broker directly through the ESP-IDF "mqtt" component, so it only builds as an ESP-IDF component (see CMakeLists.txt), not as a conventional Arduino IDE / PlatformIO Arduino-framework library. Originally based on Dawid Chyrzynski's arduino-home-assistant.
